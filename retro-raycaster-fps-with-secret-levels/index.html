const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
function normDeg(a) { a %= 360; if (a < 0) a += 360; return a; }
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function canvasU32(c) { const d = c.getContext('2d').getImageData(0, 0, c.width, c.height); return new Uint32Array(d.data.buffer); }
let seed = 1337;
function srnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function circ(g, x, y, r, c) { g.fillStyle = c; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function ell(g, x, y, rx, ry, c) { g.fillStyle = c; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); g.fill(); }
function rect(g, x, y, w, h, c) { g.fillStyle = c; g.fillRect(x, y, w, h); }
function poly(g, p, c) { g.fillStyle = c; g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); g.fill(); }
function noise(g, w, h, amt) {
  const d = g.getImageData(0, 0, w, h), a = d.data;
  for (let i = 0; i < a.length; i += 4) { if (!a[i + 3]) continue; const n = (srnd() - .5) * amt; a[i] += n; a[i + 1] += n; a[i + 2] += n; }
  g.putImageData(d, 0, 0);
}

const GLYPH = {};
for (const [ch, src] of FONT_SRC) GLYPH[ch] = src.split('|');
const fontCache = {};
function fontAtlas(color) {
  if (fontCache[color]) return fontCache[color];
  const c = mkCanvas(96 * 6, 7), g = c.getContext('2d'); g.fillStyle = color;
  for (let i = 0; i < 96; i++) {
    const rows = GLYPH[String.fromCharCode(32 + i)]; if (!rows) continue;
    for (let y = 0; y < 7; y++) for (let x = 0; x < 5; x++) if (rows[y][x] === '#') g.fillRect(i * 6 + x, y, 1, 1);
  }
  return (fontCache[color] = c);
}
function textW(s, sc = 1) { return s.length * 6 * sc - sc; }
function drawText(g, s, x, y, color, sc = 1, align) {
  s = String(s).toUpperCase();
  if (align === 'c') x = Math.round(x - textW(s, sc) / 2); else if (align === 'r') x = Math.round(x - textW(s, sc));
  const at = fontAtlas(color);
  for (let i = 0; i < s.length; i++) {
    let code = s.charCodeAt(i) - 32; if (code < 0 || code >= 96 || !GLYPH[s[i]]) continue;
    g.drawImage(at, code * 6, 0, 5, 7, x + i * 6 * sc, y, 5 * sc, 7 * sc);
  }
}
function shadowText(g, s, x, y, color, sc = 1, align, sh = '#000') { drawText(g, s, x + sc, y + sc, sh, sc, align); drawText(g, s, x, y, color, sc, align); }
function wrapText(s, maxChars) {
  const words = s.split(' '), lines = []; let line = '';
  for (const w of words) { if ((line + ' ' + w).trim().length > maxChars) { lines.push(line); line = w; } else line = (line + ' ' + w).trim(); }
  if (line) lines.push(line); return lines;
}

const T_WALL = 0, T_WALL2 = 1, T_DOOR = 2, T_DOOR_R = 3, T_DOOR_B = 4, T_DOOR_Y = 5, T_SW_OFF = 6, T_SW_ON = 7;
const TEX = [];
function makeTex(fn) { const c = mkCanvas(64, 64), g = c.getContext('2d', { willReadFrequently: true }); fn(g); return canvasU32(c); }
function drawPanelWall(g) {
  rect(g, 0, 0, 64, 64, '#596472');
  for (let py = 0; py < 64; py += 32) for (let px = 0; px < 64; px += 32) {
    rect(g, px, py, 32, 1, '#8592a0'); rect(g, px, py, 1, 32, '#8592a0');
    rect(g, px, py + 31, 32, 1, '#2f363f'); rect(g, px + 31, py, 1, 32, '#2f363f');
    rect(g, px + 5, py + 5, 22, 22, '#4b5561'); rect(g, px + 6, py + 6, 21, 21, '#646f7d');
    rect(g, px + 6, py + 6, 21, 1, '#78838f');
    for (const [rx, ry] of [[2, 2], [28, 2], [2, 28], [28, 28]]) { rect(g, px + rx, py + ry, 2, 2, '#b4bec8'); rect(g, px + rx + 1, py + ry + 1, 1, 1, '#3a414a'); }
  }
  rect(g, 0, 43, 64, 6, '#363e48'); rect(g, 0, 43, 64, 1, '#7c8794'); rect(g, 0, 48, 64, 1, '#20262d');
  rect(g, 10, 45, 4, 2, '#46e0ff'); rect(g, 46, 45, 3, 2, '#ff5a3a');
  rect(g, 40, 10, 14, 3, '#2a3038'); // vent slots
  rect(g, 40, 15, 14, 3, '#2a3038');
  noise(g, 64, 64, 14);
}
function drawRockWall(g) {
  rect(g, 0, 0, 64, 64, '#5e5853');
  for (let i = 0; i < 60; i++) { const x = srnd() * 64, y = srnd() * 64, r = 1 + srnd() * 5; circ(g, x, y, r, srnd() < .5 ? '#4b4642' : '#736c65'); }
  for (let i = 0; i < 5; i++) {
    const x = 6 + srnd() * 52, y = 6 + srnd() * 52, r = 3 + srnd() * 4;
    circ(g, x, y, r + 1, '#7f7870'); circ(g, x + .7, y + .7, r, '#3d3935');
  }
  g.lineCap = 'round';
  for (let v = 0; v < 3; v++) {
    const pts = []; let x = 4 + srnd() * 56, y = -2;
    while (y < 66) { pts.push(x, y); x += (srnd() - .5) * 14; y += 4 + srnd() * 6; }
    for (const [lw, col] of [[4, 'rgba(120,30,170,.55)'], [2, '#b347e8'], [1, '#f0a8ff']]) {
      g.strokeStyle = col; g.lineWidth = lw; g.beginPath(); g.moveTo(pts[0], pts[1]);
      for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.stroke();
    }
  }
  noise(g, 64, 64, 18);
}
function drawDoor(g) {
  rect(g, 0, 0, 64, 64, '#4a535d');
  for (let x = 6; x < 60; x += 9) rect(g, x, 4, 1, 56, '#3d454e');
  rect(g, 0, 0, 64, 3, '#252a30'); rect(g, 0, 61, 64, 3, '#252a30'); rect(g, 0, 0, 3, 64, '#252a30'); rect(g, 61, 0, 3, 64, '#252a30');
  rect(g, 3, 3, 58, 1, '#78828d'); rect(g, 3, 3, 1, 58, '#78828d');
  rect(g, 31, 3, 2, 58, '#1e2227');
  circ(g, 32, 17, 10, '#262b31'); circ(g, 32, 17, 8, '#14323f'); circ(g, 32, 17, 5, '#1d4a5c');
  rect(g, 28, 12, 3, 2, '#9be6ff'); rect(g, 27, 14, 1, 2, '#9be6ff');
  g.save(); g.beginPath(); g.rect(4, 50, 56, 9); g.clip();
  for (let x = -12, i = 0; x < 70; x += 6, i++) poly(g, [x, 59, x + 6, 59, x + 15, 50, x + 9, 50], i % 2 ? '#2e3339' : '#9aa3ab');
  g.restore();
  rect(g, 4, 49, 56, 1, '#20252b'); rect(g, 4, 59, 56, 1, '#20252b');
  noise(g, 64, 64, 10);
}

  drawPanelWall(g);

  else { drawText(g, 'EXIT', 21, 15, '#5a1c1c'); }

  rect(g, 26, on ? 29 : 45, 12, 5, '#d6d6d0'); rect(g, 26, on ? 29 : 45, 12, 1, '#ffffff');
  rect(g, 17, 34, 6, 6, on ? '#36ff6a' : '#132a18'); rect(g, 41, 34, 6, 6, on ? '#3a0c0c' : '#ff3434');
}

  TEX[T_WALL] = makeTex(drawPanelWall);

  TEX[T_DOOR_B] = makeTex(g => drawKeyDoor(g, '#0000ff'));
  TEX[T_DOOR_Y] = makeTex(g => drawKeyDoor(g, '#ffff00'));
  TEX[T_SW_OFF] = makeTex(g => drawSwitch(g, false));
  TEX[T_SW_ON] = makeTex(g => drawSwitch(g, true));
}

  if (hurtT > 0) { ctx.fillStyle = 'rgba(255,0,0,' + (hurtT * 1.1).toFixed(3) + ')'; ctx.fillRect(0, 0, W, VH); }
  if (pickT > 0) { ctx.fillStyle = 'rgba(255,220,120,' + (pickT * 1.5).toFixed(3) + ')'; ctx.fillRect(0, 0, W, VH); }
  if (game.god && state === 'play') { ctx.fillStyle = 'rgba(255,210,60,.06)'; ctx.fillRect(0, 0, W, VH); }
  if (automap) drawAutomap();
  if (state === 'dead') {
    const a = Math.min(1, deathT / .6);
    ctx.fillStyle = 'rgba(150,0,0,' + (.55 * a).toFixed(3) + ')'; ctx.fillRect(0, 0, W, VH);
    if (deathT > .6) {
      shadowText(ctx, 'YOU DIED', W / 2, 52, '#ffffff', 3, 'c');
      shadowText(ctx, 'KILLED BY ' + exitKill.toUpperCase(), W / 2, 84, '#ffc0c0', 1, 'c');
      shadowText(ctx, 'PRESS ENTER TO TRY AGAIN', W / 2, 104, '#ffd84a', 1, 'c');
    }
  }
  drawMessage();
  drawStatus();
  if (state === 'paused') {
    if (menu.mode === 'controls') { drawControls(); return; }
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    drawPanel(90, 50, 140, 84);
    shadowText(ctx, 'PAUSED', W / 2, 58, '#ffd84a', 2, 'c');
    drawMenuList(menuItems(), 80, menu.sel);
  }
}
function drawTally() {
  const T = tally;
  ctx.drawImage(STARS, 0, 0);
  shadowText(ctx, T.name, W / 2, 14, '#c070ff', 2, 'c');
  shadowText(ctx, 'COMPLETE', W / 2, 34, '#9fd8ff', 1, 'c');
  const lbl = ['KILLS', 'ITEMS', 'SECRETS', 'TIME'];
  for (let i = 0; i < 4; i++) {
    if (T.phase < i) break;
    const y = 56 + i * 18;
    shadowText(ctx, lbl[i], 70, y, '#ffb84a', 2);
    const v = Math.floor(T.shown[i]);
    shadowText(ctx, i < 3 ? v + '%' : fmtTime(v), 250, y, '#ffffff', 2, 'r');
  }
  if (T.phase >= 3) { shadowText(ctx, 'PAR', 70, 128, '#ffb84a', 2); shadowText(ctx, fmtTime(T.par), 250, 128, '#ffffff', 2, 'r'); }
  if (T.cheats) shadowText(ctx, 'CHEATS USED', W / 2, 150, '#ff6060', 1, 'c');
  if (T.done) {
    const nx = T.next === 0 ? 'THE END' : T.secretNext ? 'ENTERING A SECRET LEVEL' : 'ENTERING ' + LEVELS[T.next].name.toUpperCase();
    shadowText(ctx, nx, W / 2, 164, T.secretNext ? '#ffd040' : '#9fd8ff', 1, 'c');
    drawText(ctx, 'PRESS ENTER', W / 2, 186, '#7fb4d4', 1, 'c');
  }
}
function drawEnd() {
  ctx.drawImage(STARS, 0, 0);
  shadowText(ctx, 'THE RIFT IS CLOSED', W / 2, 10, '#c070ff', 2, 'c');
  const lines = wrapText(ENDING.toUpperCase(), 50);
  lines.forEach((l, i) => shadowText(ctx, l, 12, 32 + i * 9, '#d8e4ee'));
  const T = game.totals || { kills: 0, totKills: 0, items: 0, totItems: 0, secrets: 0, totSecrets: 0, time: 0 };
  const y = 40 + lines.length * 9;
  drawPanel(50, y, 220, 58);
  shadowText(ctx, 'KILLS ' + T.kills + '/' + T.totKills + '  (' + pct(T.kills, T.totKills) + '%)', W / 2, y + 6, '#ffb84a', 1, 'c');
  shadowText(ctx, 'ITEMS ' + T.items + '/' + T.totItems + '  (' + pct(T.items, T.totItems) + '%)', W / 2, y + 18, '#ffb84a', 1, 'c');
  shadowText(ctx, 'SECRETS ' + T.secrets + '/' + T.totSecrets + '  (' + pct(T.secrets, T.totSecrets) + '%)', W / 2, y + 30, '#ffb84a', 1, 'c');
  shadowText(ctx, 'TIME ' + fmtTime(T.time), W / 2, y + 42, '#ffb84a', 1, 'c');
  drawText(ctx, 'PRESS ENTER TO RETURN TO THE TITLE', W / 2, 188, '#7fb4d4', 1, 'c');
}

// =====================================================================
//  TEST ATTRIBUTES
// =====================================================================
const attrCache = {};
function setAttr(k, v) { v = String(v); if (attrCache[k] !== v) { attrCache[k] = v; cv.setAttribute(k, v); } }
function updateAttrs() {
  setAttr('data-state', state);
  setAttr('data-level', game.level);
  if (!P || state === 'title' || state === 'menu') {
    setAttr('data-aim', ''); setAttr('data-aim-dist', '');
    if (!P) return;
  }
  setAttr('data-x', P.x.toFixed(2)); setAttr('data-y', P.y.toFixed(2));
  setAttr('data-angle', Math.round(P.a) % 360);
  setAttr('data-health', Math.max(0, Math.ceil(P.health))); setAttr('data-armor', Math.round(P.armor));
  setAttr('data-arm', P.cur); setAttr('data-ammo', P.ammo.join('/'));
  setAttr('data-keys', (P.keys.r ? 'r' : '') + (P.keys.b ? 'b' : '') + (P.keys.y ? 'y' : ''));
  if (state === 'title' || state === 'menu') return;
  const wl = world;
  setAttr('data-kills', wl.kills + '/' + wl.totKills); setAttr('data-items', wl.itemsGot + '/' + wl.totItems); setAttr('data-secrets', wl.secrets + '/' + wl.totSecrets);
  setAttr('data-cheats', wl.cheats ? '1' : '0');
  let best = null, bd = 12;
  if (state === 'play') for (const e of wl.enemies) {
    if (!liveEnemy(e)) continue;
    const d = Math.hypot(e.x - P.x, e.y - P.y);
    if (d <= bd && los(P.x, P.y, e.x, e.y)) { bd = d; best = e; }
  }
  if (best) { setAttr('data-aim', Math.round(normDeg(Math.atan2(best.y - P.y, best.x - P.x) / D2R)) % 360); setAttr('data-aim-dist', bd.toFixed(1)); }
  else { setAttr('data-aim', ''); setAttr('data-aim-dist', ''); }
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
let last = 0;
function update(dt) {
  if (msgT > 0) msgT -= dt;
  if (state === 'title' || state === 'menu') { titleAng = normDeg(titleAng + dt * 8); return; }
  if (state === 'tally') { updateTally(dt); return; }
  if (state === 'play' || state === 'dead') {
    hurtT = Math.max(0, hurtT - dt); pickT = Math.max(0, pickT - dt); winceT -= dt; grinT -= dt;
    faceT += dt; if (faceT >= 1.5) { faceT = 0; faceSeq = (faceSeq + 1) % 3; faceLook = [-1, 0, 1][faceSeq]; }
    if (state === 'play') { world.time += dt; updatePlayer(dt); } else deathT += dt;
    if (state !== 'play' && state !== 'dead') return;
    updateDoors(dt); updateEnemies(dt); updateProjectiles(dt);
    if (world.exitT >= 0 && state === 'play') { world.exitT -= dt; if (world.exitT < 0) finishLevel(); }
  }
}
function draw() {
  if (state === 'title' || state === 'menu') drawTitle();
  else if (state === 'tally') drawTally();
  else if (state === 'end') drawEnd();
  else drawPlay();
}
function frame(now) {
  const dt = last ? Math.min((now - last) / 1000, .05) : 0; last = now;
  update(dt); draw(); updateAttrs();
  requestAnimationFrame(frame);
}
function init() {
  buildTextures(); buildGradients(); buildEnemySprites(); buildItemSprites(); buildWeapons();
  SB_BG = buildStatusBG(); STARS = buildStars();
  demoWorld = parseLevel(1); world = demoWorld;
  resize();
  requestAnimationFrame(frame);
}
init();
</script>
