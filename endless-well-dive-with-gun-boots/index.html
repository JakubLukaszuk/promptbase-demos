function cnv(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c}
function scaleUp(c,s){if(s===1)return c;const o=cnv(c.width*s,c.height*s),g=o.getContext('2d');g.imageSmoothingEnabled=false;g.drawImage(c,0,0,o.width,o.height);return o}
function pix(rows,pal,s){const h=rows.length,w=rows[0].length,c=cnv(w,h),g=c.getContext('2d');for(let y=0;y<h;y++)for(let x=0;x<w;x++){const k=rows[y][x];if(k!=='.'&&pal[k]){g.fillStyle=pal[k];g.fillRect(x,y,1,1)}}return scaleUp(c,s)}
function art(w,h,s,fn){const c=cnv(w,h),g=c.getContext('2d');fn((x,y,col)=>{x=Math.round(x);y=Math.round(y);if(x<0||y<0||x>=w||y>=h)return;g.fillStyle=col;g.fillRect(x,y,1,1)});return scaleUp(c,s)}
function flip(c){const o=cnv(c.width,c.height),g=o.getContext('2d');g.translate(c.width,0);g.scale(-1,1);g.drawImage(c,0,0);return o}
function white(c){const o=cnv(c.width,c.height),g=o.getContext('2d');g.drawImage(c,0,0);g.globalCompositeOperation='source-in';g.fillStyle='#ffffff';g.fillRect(0,0,o.width,o.height);return o}

// ---------------------------------------------------------------- save
const SAVE_KEY='welldive-save';
function loadSave(){
 const fresh={best:0,bestCombo:0,dives:0,daily:{}};
 try{const raw=localStorage.getItem(SAVE_KEY);if(!raw)return fresh;const s=JSON.parse(raw);if(!s||typeof s!=='object'||Array.isArray(s))return fresh;
  const n=v=>(typeof v==='number'&&isFinite(v)&&v>=0)?Math.floor(v):0;
  const daily={};if(s.daily&&typeof s.daily==='object'&&!Array.isArray(s.daily))for(const k in s.daily)if(/^\d{8}$/.test(k))daily[k]=n(s.daily[k]);
  return {best:n(s.best),bestCombo:n(s.bestCombo),dives:n(s.dives),daily};
 }catch(e){return fresh}
}
let SAVE=loadSave();
function writeSave(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(SAVE))}catch(e){}}
function todayKey(){const d=new Date();return ''+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')}
function todayLabel(){const k=todayKey();return k.slice(0,4)+'-'+k.slice(4,6)+'-'+k.slice(6)}
function testSeed(){try{const v=localStorage.getItem('welldive-test-seed');if(v!==null&&v.trim()!==''&&isFinite(Number(v)))return Math.floor(Number(v))}catch(e){}return null}

// ---------------------------------------------------------------- audio
const AU={ctx:null,master:null,noise:null,wh:null,whg:null,muted:false,lastGem:0};
function audioInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 try{const a=new AC();AU.ctx=a;const m=a.createGain();m.gain.value=AU.muted?0:0.16;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=3200;m.connect(f);f.connect(a.destination);AU.master=m;
  const b=a.createBuffer(1,Math.floor(a.sampleRate*0.6),a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=b;
  const o=a.createOscillator();o.type='sine';o.frequency.value=300;const g=a.createGain();g.gain.value=0;o.connect(g);g.connect(m);o.start();AU.wh=o;AU.whg=g;
 }catch(e){AU.ctx=null}
}
function tone(type,f0,f1,dur,vol,delay){const a=AU.ctx;if(!a||a.state!=='running')return;const t=a.currentTime+(delay||0);const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(AU.master);o.start(t);o.stop(t+dur+0.03)}
function noise(dur,vol,fc,delay,type){const a=AU.ctx;if(!a||a.state!=='running')return;const t=a.currentTime+(delay||0);const s=a.createBufferSource();s.buffer=AU.noise;const f=a.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=fc;const g=a.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);s.connect(f);f.connect(g);g.connect(AU.master);s.start(t);s.stop(t+dur+0.03)}
const SFX={
 shot(){tone('square',240,80,0.07,0.16);noise(0.05,0.22,2000,0,'bandpass');tone('sine',700,1400,0.05,0.05,0.025)},

 else{const l=unlocked(depth);do{id=l[Math.floor(G.rng()*l.length)]}while(id===G.prev);G.prev=id;G.picks++;if(G.picks%20===0)G.needShop=true}

  switch(k){

   case 't':cells[i]=TUR;spawnEnemy('turret',c,r,ch,hpB,d100);break;
   case 'g':G.coins.push({x:c*T+20,y:(idx*8+r)*T+28,vx:0,vy:0,v:2,st:true,pile:true,age:1,mag:false});break;
   case 'c':spawnEnemy('crawler',c,r,ch,hpB,d100);break;

function stepPlay(dt){
 const p=G.p;G.time+=dt;
 const L=inp.left(),R=inp.right(),A=inp.act(),D=inp.down();
 const dir=(R?1:0)-(L?1:0);
 if(dir){p.face=dir;p.vx=approach(p.vx,dir*230,(p.vx*dir<0?3000:2400)*dt)}else p.vx=approach(p.vx,0,3000*dt);
 if(G.actBuf>0)G.actBuf-=dt;

 // the press that jumped does not also fire on the way up: release it, or keep holding past the apex
 if(p.jumpHold&&(!A||p.vy>=0))p.jumpHold=false;

 if(D&&p.ground){const r=Math.floor((p.y+PH)/T),c0=Math.floor(p.x/T),c1=Math.floor((p.x+PW-0.001)/T);let led=false;for(let c=c0;c<=c1;c++)if(tileAt(c,r)===LEDGE)led=true;if(led)p.drop=0.2}
 if(p.drop>0)p.drop-=dt;
 const dropping=D||p.drop>0;
 p.vy=Math.min(560,p.vy+1500*dt);
 moveX(p,p.vx*dt);
 const prevBottom=p.y+PH,vy0=p.vy;
 p.y+=p.vy*dt;
 let landT=-1,landRow=0;
 if(p.vy>0){const row=Math.floor((p.y+PH)/T),c0=Math.floor(p.x/T),c1=Math.floor((p.x+PW-0.001)/T);
  for(let c=c0;c<=c1;c++){const t=tileAt(c,row);if(SOLID(t)){if(landT!==SHOPF)landT=t}else if(t===LEDGE&&!dropping&&prevBottom<=row*T+0.01){if(landT<0)landT=LEDGE}}
  if(landT>=0){p.y=row*T-PH;p.vy=0;landRow=row}}
 else if(p.vy<0){const row=Math.floor(p.y/T),c0=Math.floor(p.x/T),c1=Math.floor((p.x+PW-0.001)/T);
  for(let c=c0;c<=c1;c++)if(SOLID(tileAt(c,row))){p.y=(row+1)*T;p.vy=0;break}}
 const was=p.ground;p.ground=landT>=0;
 if(p.ground&&!was)onLand(landT,landRow);
 if(p.ground)p.ammo=p.maxammo;
 updEnemies(dt);
 if(state!=='play')return;
 playerVsEnemies(vy0,dt);
 if(state!=='play')return;
 updBullets(dt);updBolts(dt);updCoins(dt);updParts(dt);ambient(dt);

 ensureChunks();prune();

 if(d>G.maxDepth){if(Math.floor(d/100)>Math.floor(G.maxDepth/100)){const m=Math.floor(d/100)*100;banner('DEPTH '+m+' m',1.4);announce('Depth '+m)}G.maxDepth=d}
}

function updEnemies(dt){

 for(const e of G.enemies){
  if(e.dead||e.y+e.h<top||e.y>bot)continue;
  e.t+=dt;if(e.flash>0)e.flash-=dt;
  switch(e.k){
   case 'crawler':case 'spiker':walk(e,dt);break;
   case 'bat':{const cx=e.x+e.w/2,cy=e.y+e.h/2,dx=pcx-cx,dy=pcy-cy,d=Math.hypot(dx,dy);if(!e.awake&&d<=200)e.awake=true;if(e.awake&&d>1){e.x+=dx/d*e.spd*dt;e.y+=dy/d*e.spd*dt;e.dir=dx<0?-1:1}break}

function walk(e,dt){
 if(!e.ground){
  const pb=e.y+e.h;e.vy=Math.min(560,e.vy+1500*dt);e.y+=e.vy*dt;
  const row=Math.floor((e.y+e.h)/T),c0=Math.floor((e.x+2)/T),c1=Math.floor((e.x+e.w-2)/T);
  for(let c=c0;c<=c1;c++){const t=tileAt(c,row);if(SOLID(t)||(t===LEDGE&&pb<=row*T+0.01)){e.y=row*T-e.h;e.vy=0;e.ground=true;break}}
  return;
 }
 const row=Math.floor((e.y+e.h+1)/T),cl=Math.floor((e.x+2)/T),cr=Math.floor((e.x+e.w-2)/T);
 if(!STAND(tileAt(cl,row))&&!STAND(tileAt(cr,row))){e.ground=false;return}
 const nx=e.x+e.dir*e.spd*dt,fc=Math.floor((e.dir>0?nx+e.w-0.001:nx)/T),mid=Math.floor((e.y+e.h/2)/T);

}

function playerVsEnemies(vy0,dt){

  const feet=p.y+PH;
  if(vy0>0&&feet-e.y<=12){
   if(e.k==='spiker'){p.vy=-300;p.ground=false;hurt(e.x+e.w/2,false);if(state!=='play')return;continue}
   stomp(e);continue;
  }
  if(overlap(p.x,p.y,PW,PH,e.x+3,e.y+3,e.w-6,e.h-6)){hurt(e.x+e.w/2,true);if(state!=='play')return}
 }
}
function stomp(e){
 const p=G.p,cx=e.x+e.w/2,cy=e.y;
 p.ground=false;p.jumpHold=false;kill(e);p.vy=-420;p.ammo=p.maxammo;

 if(G.up.quake){ring(cx,cy+10,ACC);for(const o of G.enemies){if(o.dead)continue;if(Math.hypot(o.x+o.w/2-cx,o.y+o.h/2-(e.y+e.h/2))<=80)damage(o,2)}}

  b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(const e of G.enemies){
   if(e.dead||b.hit.includes(e))continue;
   if(overlap(b.x-3,b.y-6,6,12,e.x,e.y,e.w,e.h)){b.hit.push(e);damage(e,dmg());if(b.pierce>0)b.pierce--;else{b.dead=true;break}}
  }
  if(b.dead)continue;

function updCoins(dt){

  if(g.mag){const s=600*dt;if(d>s){g.x+=dx/d*s;g.y+=dy/d*s}else{g.x=pcx;g.y=pcy}}
  else if(!g.st){
   g.vy=Math.min(360,g.vy+900*dt);g.x+=g.vx*dt;
   const cx=Math.floor((g.x+(g.vx>0?5:-5))/T);if(SOLID(tileAt(cx,Math.floor(g.y/T)))){g.vx=-g.vx*0.5;g.x+=g.vx*dt*2}
   const py=g.y;g.y+=g.vy*dt;
   if(g.vy>0){const r=Math.floor((g.y+5)/T),t=tileAt(Math.floor(g.x/T),r);if(SOLID(t)||(t===LEDGE&&py+5<=r*T+0.5)){g.y=r*T-5;g.vy=Math.abs(g.vy)>60?-g.vy*0.4:0;g.vx*=0.7}}
   else if(g.vy<0){const r=Math.floor((g.y-5)/T);if(SOLID(tileAt(Math.floor(g.x/T),r))){g.y=(r+1)*T+5;g.vy=0}}
  }

 }

const dcache={};

function computeAI(){
 const p=G.p,pcx=p.x+PW/2,pcy=p.y+PH/2,feet=p.y+PH;
 const pc=clampc(Math.floor(pcx/T)),fr=Math.floor(feet/T);
 const clear=(c,ra,rb)=>{for(let r=ra;r<rb;r++){const t=tileAt(c,r);if(t===ROCK||t===TUR)return false}return true};
 const find=pred=>{let best=null,bd=1e9;for(const e of G.enemies){if(e.dead||!pred(e.k))continue;const ex=e.x+e.w/2,ey=e.y+e.h/2;if(ey<=feet-4)continue;const er=Math.floor(ey/T);if(er-fr>6)continue;const ec=clampc(Math.floor(ex/T));if(!clear(ec,fr,er))continue;const d=Math.hypot(ex-pcx,ey-pcy);if(d<bd){bd=d;best=ec}}return best};
 let tx=pc,kind='';
 let c=find(k=>k==='crawler'||k==='bat'||k==='jelly');
 if(c!==null){tx=c;kind='stomp'}
 else{c=find(k=>k==='spiker');if(c!==null){tx=c;kind='shoot'}
  else{for(let r=fr;r<fr+3;r++){const t=tileAt(pc,r);if(t===BLK||t===GEMB){tx=pc;kind='block';break}}
   if(!kind){kind='open';tx=pc;outer:for(let d=0;d<12;d++){for(const cc of [pc-d,pc+d]){if(cc<0||cc>11)continue;const t=tileAt(cc,fr);if(t!==ROCK&&t!==BLK&&t!==GEMB&&t!==LEDGE&&t!==TUR&&t!==SHOPF){tx=cc;break outer}}}}}}
 let dxc='',dd=1e9;const pr=Math.floor(pcy/T);
 const chk=(x,y,w,h)=>{if(y>feet)return;const er=Math.floor((y+h/2)/T);if(Math.abs(er-pr)>2)return;const ec=clampc(Math.floor((x+w/2)/T));if(Math.abs(ec-pc)>3)return;const d=Math.hypot(x+w/2-pcx,y+h/2-pcy);if(d<dd){dd=d;dxc=String(ec)}};
 for(const e of G.enemies)if(!e.dead&&e.k!=='turret')chk(e.x,e.y,e.w,e.h);
 for(const b of G.bolts)if(!b.dead)chk(b.x,b.y,b.w,b.h);
 return {tx:String(tx),kind,danger:dxc};
}

  txt('['+(i+1)+']',x+16,y+38,26,can?ACC:'#7f8c99','left');
  g.drawImage(S.icon[o.id],x+w-50,y+12);
  let yy=y+96;for(const l of wrap(u.name,w-32,26)){txt(l,x+w/2,yy,26,'#ffffff','center');yy+=30}
  yy+=8;for(const l of wrap(u.eff,w-36,17)){txt(l,x+w/2,yy,17,'#b8c8d8','center');yy+=22}
  const lvl=u.max===Infinity?'':'owned '+G.up[o.id]+'/'+u.max;txt(lvl,x+w/2,y+h-66,16,'#7f8c99','center');
  g.drawImage(S.coin[0],x+w/2-54,y+h-44);txt(String(o.price),x+w/2-26,y+h-28,30,o.sold?'#7f8c99':G.gems>=o.price?ACC:'#e0605a','left');
  if(o.sold){g.save();g.translate(x+w/2,y+h/2);g.rotate(-0.25);txt('SOLD',0,0,60,'#7fe08a','center');g.restore()}
  btns.push({x,y,w,h,fn:()=>buy(i)});
 }
 button(460,540,360,60,'Leave (Enter / Down)',26,leaveShop,true);
 txt('Keys 1-3 buy. Prices rise 25% at every bell.',640,640,18,'#8fa4b8','center');
}
function drawSummary(){
 const s=G.summary;if(!s)return;
 g.fillStyle='rgba(0,0,0,0.6)';g.fillRect(0,0,W,H);
 panel(340,60,600,600,0.95);
 txt('THE DIVE ENDS',640,124,44,ACC,'center');
 if(s.newBest&&Math.floor(performance.now()/300)%2===0)txt('NEW BEST',640,166,30,'#7fe08a','center');
 else if(s.newBest)txt('NEW BEST',640,166,30,'#ffffff','center');
 const rows=[['Depth reached',s.depth+' m'],[GEM_NAME[0].toUpperCase()+GEM_NAME.slice(1),String(s.gems)],['Kills',String(s.kills)],['Best combo',String(s.bestCombo)],['Seed',s.seed+(s.mode==='daily'?' (daily)':' (endless)')]];
 let y=222;for(const [k,v] of rows){txt(k,380,y,24,'#9fb4c8','left');txt(v,900,y,26,'#ffffff','right');y+=40}
 txt('Salvage bought',380,y,24,'#9fb4c8','left');y+=30;
 const cnt={};for(const id of s.bought)cnt[id]=(cnt[id]||0)+1;
 const list=Object.keys(cnt).map(id=>UPG[id].name+(cnt[id]>1?' x'+cnt[id]:'')).join(', ')||'nothing';
 for(const l of wrap(list,520,18).slice(0,4)){txt(l,380,y,18,'#dfe8f0','left');y+=24}
 button(380,570,250,56,'Enter - title',22,toTitle,false);
 button(650,570,250,56,'R - dive again',22,()=>startDive(s.mode,s.seed),true);
}
function updWhistle(){
 if(!AU.ctx||!AU.whg)return;const t=AU.ctx.currentTime;let v=0,f=300;
 if(state==='play'&&!G.p.ground&&G.p.vy>0){const k=G.p.vy/560;v=0.03*k*k;f=320+k*k*1100}
 AU.whg.gain.setTargetAtTime(v,t,0.06);AU.wh.frequency.setTargetAtTime(f,t,0.06);
}

// ---------------------------------------------------------------- loop
let last=performance.now(),acc=0;
function frame(now){
 let rdt=(now-last)/1000;last=now;if(!(rdt>0))rdt=0;if(rdt>0.1)rdt=0.1;
 if(hitstop>0){hitstop--}
 else{acc+=rdt;let n=0;while(acc>=STEP&&n<20){step(STEP);acc-=STEP;n++}if(n>=20)acc=0}
 render(rdt);
 requestAnimationFrame(frame);
}
toTitle();updateData();render(0);
requestAnimationFrame(frame);
window.__welldive={get G(){return G},get state(){return state},step,tileAt,CH};
</script>
